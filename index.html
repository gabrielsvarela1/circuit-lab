<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Simulador de circuitos elétricos no browser: monta o circuito e vê correntes e tensões ao vivo." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e293b'/%3E%3Cpath d='M4 16h7l2-6 3 12 3-12 2 6h7' fill='none' stroke='%23fbbf24' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Circuit Lab</title>
  </head>
  <body>
    <header class="top">
      <h1>Circuit Lab</h1>
      <nav class="learn">
        <button data-cmd="examples">Exemplos</button>
        <button data-cmd="exercises">Exercícios</button>
        <button data-cmd="theme">Tema escuro</button>
      </nav>
      <nav class="toolbar">
        <button data-cmd="undo" title="Anular (Ctrl+Z)">Anular</button>
        <button data-cmd="redo" title="Refazer (Ctrl+Y)">Refazer</button>
        <button data-cmd="clear">Limpar</button>
        <button data-cmd="share">Partilhar</button>
      </nav>
    </header>
    <main class="layout">
      <aside class="palette" aria-label="Componentes"></aside>
      <section class="stage">
        <div class="status" role="status" hidden></div>
        <svg class="board" tabindex="0" role="application" aria-label="Grelha do circuito. Setas movem o cursor, Enter desenha fios, Espaço escolhe um componente." aria-describedby="sr-status"></svg>
        <div class="tooltip" hidden></div>
        <div class="zoom">
          <button data-cmd="zoom-in" aria-label="Aproximar">+</button>
          <button data-cmd="zoom-out" aria-label="Afastar">−</button>
          <button data-cmd="fit" aria-label="Ajustar à vista">Ajustar</button>
          <button data-cmd="pan" aria-pressed="false">Mover vista</button>
        </div>
        <p class="note" hidden></p>
        <p class="sr-status visually-hidden" id="sr-status" aria-live="polite"></p>
      </section>
      <section class="exercise" aria-label="Exercício" hidden></section>
      <aside class="panel"></aside>
    </main>
    <dialog class="examples">
      <div class="ex-head"><h2>Exemplos</h2><button data-cmd="close-examples">Fechar</button></div>
      <ul class="example-list"></ul>
    </dialog>
    <div class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
